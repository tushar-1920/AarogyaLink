services:
  - type: web
    name: aarogyalink
    runtime: python
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "false"
      - key: ADMIN_EMAIL
        value: admin@aarogyalink.in
      - key: ADMIN_PASSWORD
        value: Admin@2025#Secure
      - key: PYTHON_VERSION
        value: "3.11.9"
    disk:
      name: uploads
      mountPath: /opt/render/project/src/frontend/static/uploads
      sizeGB: 1